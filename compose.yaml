# This runs ONLY PostgreSQL. The Go API/worker are not implemented yet.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: failureplane
      POSTGRES_PASSWORD: dev_only_change_me
      POSTGRES_DB: failureplane
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U failureplane -d failureplane"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
