openapi: 3.0.3
info:
  title: FailurePlane proposed client API
  version: 0.1.0-design
  description: >-
    DESIGN CONTRACT ONLY. Endpoints are not implemented by this starter.
    A successful POST must represent an accepted durable transaction.
servers:
  - url: http://localhost:8080
paths:
  /v1/executions:
    post:
      summary: Submit an execution idempotently
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool, input]
              properties:
                tool:
                  type: string
                  description: Immutable tool version reference
                input:
                  type: object
                  additionalProperties: true
      responses:
        '202':
          description: Durably accepted or matching idempotent retry
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
        '400':
          description: Malformed input
        '401':
          description: Unauthenticated
        '403':
          description: Unauthorized
        '409':
          description: Same idempotency key used with different request
        '429':
          description: Tenant quota exceeded
  /v1/executions/{executionId}:
    get:
      summary: Read a tenant-authorized execution
      parameters:
        - name: executionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Execution details
        '401':
          description: Unauthenticated
        '403':
          description: Unauthorized
        '404':
          description: Not found
